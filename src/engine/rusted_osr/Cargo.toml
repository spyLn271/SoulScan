[package]
name = "rusted_osr"
version = "0.1.0"
edition = "2024"

[dependencies]
rusted_soul_dex = {path = "../rusted_math"}
rusted_engine = {path = "../rusted_engine"}
redis = "1.0.5"
r2d2 = "0.8"
r2d2_redis = "0.14"
serde_json = "1"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
clap = { version = "4", features = ["derive", "env"] }
petgraph = "0.8.3"
crossbeam = "0.8.4"
arc-swap = "1.9.1"
