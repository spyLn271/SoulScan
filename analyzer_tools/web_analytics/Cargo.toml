[package]
name = "web_analytics"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["json", "tracing", "ws"] }
tokio = { version = "1.52.3", features = ["rt-multi-thread"] }
r2d2_redis = "0.14.0"
r2d2 = "0.8.10"
deadpool = "0.13.0"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-native-tls", "postgres"] }
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusted_soul_dex = {path = "../../src/engine/rusted_math"}
rusted_engine = {path = "../../src/engine/rusted_engine"}
clap = {version = "4.6.1", features = []}
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"